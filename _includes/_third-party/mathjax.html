{% if site.mathjax.enable %}
  {% unless site.mathjax.per_page %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath:  [ ['$','$'], ['\\(','\\)'] ],
          processEscapes: true
        },
        svg: { fontCache: 'global' },
        startup: {
          ready: function () {
            MathJax.startup.promise.then(function () {
              const items = MathJax.startup.document.mathItems;
              if (items) {
                items.forEach(item => {
                  const elem = item.start.node.parentNode;
                  if (elem) elem.classList.add('has-jax');
                });
              }
            });
            MathJax.startup.defaultReady();
          }
        }
      };
    </script>
    <!-- 如果一定要 polyfill，用 jsdelivr 镜像；否则可整行删除 -->
    <script src="https://cdn.jsdelivr.net/npm/polyfill.io@3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endunless %}
{% endif %}
