{% if site.mathjax.enable %}
  {% if page.layout == 'index' or page.mathjax or site.mathjax.per_page == nil or site.mathjax.per_page == false %}
    <script>
      MathJax = {
        tex: {
          inlineMath: [ ['$','$'], ["\\(","\\)"] ],
          processEscapes: true
        },
        svg: {
          fontCache: 'global'
        },
        startup: {
          ready: function() {
            var all = MathJax.startup.document.getMathItemsWithin(window.document.body);
            for (var i = 0; i < all.length; i++) {
              all[i].sourceElement().parentNode.classList.add('has-jax');
            }
          }
        }
      };
    </script>
    <script src="{{ site.mathjax.cdn }}"></script>
    <script src="{{ site.mathjax.cdn_mathjax }}"></script>
  {% endif %}
{% endif %}
